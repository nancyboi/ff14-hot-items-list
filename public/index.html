<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FF14 Hot Items</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🔥 Hot Items</h1>
    <p id="subtitle" class="subtitle">Loading...</p>
  </header>

  <main>
    <div id="empty" class="empty hidden">
      No data yet. Run <code>npm run generate -- --world=Siren</code>, then refresh this page.
    </div>
    <table id="table" class="hidden">
      <thead>
        <tr>
          <th>Item</th>
          <th>Sales/day</th>
          <th>Current price</th>
          <th>Avg price</th>
          <th>Effort</th>
          <th>Note</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <script src="app.js"></script>
</body>
</html>
